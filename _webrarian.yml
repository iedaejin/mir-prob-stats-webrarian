# Settings for this webrarian collection. Every key is described in
# vignette("config-reference", package = "webrarian"). settings_set(),
# acquire_*() and withdraw_*() rewrite this file, so comments are not kept.
project:
  name: MIR Prob and Stats - R examples
  description: Browser R workspace for MIR Probability and Statistics. Prof. Dae-Jin
    Lee, daelee@faculty.ie.edu, IE University - Scitech.
webr:
  version: 0.6.0
packages:
  prebuilt: tidyverse
  repos: []
  github: []
  local: []
  dependencies: true
files:
  include:
  - START-HERE.R
  - 01-introduction/
  - 02-causation/
  - 03-describing-a-single-variable/
  - 04-correlation-pt1/
  - 05-correlation-pt2/
  - 06-regression-description-prediction-pt1/
  - 07-regression-description-prediction-pt2/
  - 09-probability-theory-pt1/
  - 10-probability-theory-pt2/
  - 11-estimation-and-uncertainty/
  - 12-hypothesis-testing/
  - 13-reversion-to-the-mean/
  - 14-correlation-and-causation/
  - 16-randomized-experiments-pt1/
  - 17-randomized-experiments-pt2/
  - 18-controlling-for-confounders-pt1/
  - 19-controlling-for-confounders-pt2/
  - 20-mechanisms/
  exclude:
  - '**/*.Rhistory'
  - '**/.DS_Store'
  mount-point: /home/web_user
repl:
  startup-script: START-HERE.R
  auto-open: START-HERE.R
  auto-run: []
  share-links: open
  panels:
    editor: true
    terminal: true
    files: true
    plot: true
    environment: true
build:
  output-dir: _site
  offline: false
  bundle-engine: false
  clean: true
  service-worker: true
